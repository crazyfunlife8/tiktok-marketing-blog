{{/* partials/pagination.html — 分頁導覽 */}}
{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="分頁">
  {{ if .HasPrev }}
    <a href="{{ .Prev.URL | relURL }}">&larr; 上一頁</a>
  {{ end }}
  {{ range .Pagers }}
    {{ if eq . $.Pager }}
      <span class="current">{{ .PageNumber }}</span>
    {{ else }}
      <a href="{{ .URL | relURL }}">{{ .PageNumber }}</a>
    {{ end }}
  {{ end }}
  {{ if .HasNext }}
    <a href="{{ .Next.URL | relURL }}">下一頁 &rarr;</a>
  {{ end }}
</nav>
{{ end }}
